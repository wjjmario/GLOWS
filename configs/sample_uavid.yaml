extends: full.yaml
dataset:
  root: samples/uavid
  image_dir: image
  label_dir: mask
  train_split: test
  infer_split: test
task:
  mode: multiclass
  background_id: 5
  ignore_id: 255
  target_classes:
    0: building
    1: road
    2: tree
    3: low_vegetation
    4: car
    5: background_clutter
  label_remap:
    0: 0
    1: 1
    2: 2
    3: 3
    4: 4
    5: 4
    6: 255
    7: 5
hybrid_anchor:
  car_patch_tokens: 2
  cache_dir: cache/uavid/dino_rotation
proposal:
  cache_dir: cache/uavid/sam2
train:
  output_dir: outputs/sample_uavid
  batch_size: 1
  epochs: 3
infer:
  output_dir: outputs/sample_uavid/prediction
