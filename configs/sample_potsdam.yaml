extends: full.yaml
dataset:
  root: samples/potsdam
  image_dir: image
  label_dir: mask
  train_split: test
  infer_split: test
task:
  mode: multiclass
  background_id: 5
  ignore_id: 5
  target_classes:
    0: impervious_surfaces
    1: building
    2: low_vegetation
    3: tree
    4: car
encoder:
  image_size: 1024
proposal:
  min_area: 200
  cache_dir: cache/potsdam/sam2
global_prototype:
  fusion:
    enabled: false
hybrid_anchor:
  car_patch_tokens: 1
  cache_dir: cache/potsdam/dino_rotation
train:
  batch_size: 1
  output_dir: outputs/sample_potsdam
  epochs: 3
infer:
  output_dir: outputs/sample_potsdam/prediction
